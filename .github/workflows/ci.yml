name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: multizap
          POSTGRES_PASSWORD: multizap
          POSTGRES_DB: multizap_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U multizap -d multizap_test" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://multizap:multizap@localhost:5432/multizap_test
      DATABASE_URL: postgresql://multizap:multizap@localhost:5432/multizap_test
      REDIS_URL: redis://localhost:6379
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Navegador para os testes de ponta a ponta
        run: pnpm exec playwright install --with-deps chromium
      - name: Testes de ponta a ponta (API, worker e painel reais)
        run: pnpm test:e2e
        env:
          E2E_DATABASE_URL: postgresql://multizap:multizap@localhost:5432/multizap_test
      - name: Relatório dos testes de ponta a ponta
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: tests/e2e/.data/
          retention-days: 7
